name: finos-core
services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: finos_owner
      POSTGRES_DB: finos
      POSTGRES_PASSWORD: ${COMPOSE_OWNER_PASSWORD:?Generate .local/compose.env first}
      APP_DB_PASSWORD: ${COMPOSE_APP_PASSWORD:?Generate .local/compose.env first}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U finos_owner -d finos"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    environment:
      REDIS_PASSWORD: ${COMPOSE_REDIS_PASSWORD:?Generate .local/compose.env first}
      REDISCLI_AUTH: ${COMPOSE_REDIS_PASSWORD:?Generate .local/compose.env first}
    command:
      [
        sh,
        -ec,
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.4.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      BIND_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://postgres:5432/finos
      DB_USER: finos_app
      DB_PASSWORD: ${COMPOSE_APP_PASSWORD:?Generate .local/compose.env first}
      MIGRATION_USER: finos_owner
      MIGRATION_PASSWORD: ${COMPOSE_OWNER_PASSWORD:?Generate .local/compose.env first}
      EVENT_MODE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PASSWORD: ${COMPOSE_REDIS_PASSWORD:?Generate .local/compose.env first}
      FINOS_MARKET_ENABLED: ${FINOS_MARKET_ENABLED:-true}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      backend: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  pgdata:
  redisdata:
  kafkadata:
