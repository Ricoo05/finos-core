name: Verify FINOS-Core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: finos_owner
          POSTGRES_PASSWORD: finos-ci-owner
          POSTGRES_DB: finos_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U finos_owner -d finos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        image: apache/kafka:4.4.0
        env:
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:19093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports: ["19092:19092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092"
          --health-interval 10s --health-timeout 10s --health-retries 20
    env:
      DB_USER: finos_app
      DB_PASSWORD: finos-ci-app
      MIGRATION_USER: finos_owner
      MIGRATION_PASSWORD: finos-ci-owner
      EVENT_MODE: kafka
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:19092
      REDIS_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan complete Git history for secrets
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts=--all --redact --no-banner --report-format json --report-path secrets-report.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Provision isolated test and demo databases
        env:
          PGPASSWORD: finos-ci-owner
        run: |
          psql -h 127.0.0.1 -p 55432 -U finos_owner -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE finos_app LOGIN PASSWORD 'finos-ci-app';
          CREATE DATABASE finos OWNER finos_owner;
          SQL
      - name: Backend integration tests and package
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:55432/finos_test
          EVENT_MODE: postgres
          TEST_KAFKA: "true"
        run: mvn -B -f backend/pom.xml verify
      - name: Audit resolved Maven dependencies
        run: |
          mvn -B -f backend/pom.xml dependency:tree -DoutputType=tgf -DoutputFile=target/dependencies.tgf
          node scripts/audit-maven.mjs
      - name: Require real Kafka coverage
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in glob.glob('backend/target/surefire-reports/TEST-*.xml')]
          assert sum(int(s.attrib['tests']) for s in suites)==13
          assert all(int(s.attrib.get(k,0))==0 for s in suites for k in ('failures','errors','skipped'))
          PY
      - run: npm ci && npm run format:check && npm audit --audit-level=moderate && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start app and check readiness
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:55432/finos
        run: |
          java -jar backend/target/ledger-0.1.0.jar --finos.market-enabled=false > backend.log 2>&1 &
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 --strictPort > frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/api/state > /dev/null; then exit 0; fi
            sleep 1
          done
          cat backend.log frontend.log
          exit 1
      - run: npm test && npm run test:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification
          path: |
            backend/target/surefire-reports/
            backend/target/osv-report.json
            secrets-report.json
            playwright-report/
            test-results/
            backend.log
            frontend.log
